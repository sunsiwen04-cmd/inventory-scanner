<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Barcode Entry</title>

<script src="https://unpkg.com/@ericblade/quagga2/dist/quagga.min.js"></script>

<style>

body {
    font-family: Arial;
    text-align: center;
    padding: 10px;
}

#camera {
    width:100%;
    max-width:400px;
    margin:auto;
}

input, select, button {

    width:90%;
    max-width:350px;

    padding:12px;

    margin:8px;

    font-size:18px;

}


#barcode {

    background:#eee;

}


</style>

</head>


<body>


<h2>📦 Barcode Entry</h2>


<div id="camera"></div>


<input id="barcode" 
placeholder="BARCODE"
readonly>


<input id="batch" 
placeholder="Batch No.">


<input id="pieces" 
placeholder="Pieces"
type="number">


<input id="cartons" 
placeholder="Cartons"
type="number">


<input id="qty" 
placeholder="Qty(KG)"
type="number"
step="0.01">



<select id="writer">

<option value="">Written by</option>

<option>Sitong</option>

<option>Yazhen</option>

<option>JIANGHUA</option>

<option>KM</option>

<option>KY</option>

<option>Kyaw</option>

</select>



<button onclick="submitData()">
ENTER / SUBMIT
</button>



<script>


Quagga.init({

inputStream: {

name:"Live",

type:"LiveStream",

target:document.querySelector("#camera"),

constraints:{

facingMode:"environment"

}

},


decoder:{

readers:[

"ean_reader",

"ean_8_reader",

"code_128_reader"

]

}

},function(err){

if(err){

console.log(err);

return;

}

Quagga.start();


});




Quagga.onDetected(function(data){

let code=data.codeResult.code;


document.getElementById("barcode").value=code;


});




function submitData(){


alert(

"Barcode: "+
document.getElementById("barcode").value+

"\nBatch: "+
document.getElementById("batch").value+

"\nPieces: "+
document.getElementById("pieces").value+

"\nCartons: "+
document.getElementById("cartons").value+

"\nQty(KG): "+
document.getElementById("qty").value+

"\nWritten by: "+
document.getElementById("writer").value

);


}


</script>


</body>

</html>
