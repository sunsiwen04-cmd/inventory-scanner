<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Barcode Scanner</title>

<script src="https://unpkg.com/@ericblade/quagga2/dist/quagga.min.js"></script>

<style>

body {
    text-align:center;
    font-family:Arial;
}

#camera {
    width:100%;
    max-width:400px;
    margin:auto;
}

#result {
    font-size:24px;
    margin-top:20px;
}

</style>

</head>


<body>

<h2>📦 EAN-13 Barcode Scanner</h2>

<div id="camera"></div>

<div id="result">
等待扫描...
</div>


<script>


Quagga.init({

    inputStream: {

        name: "Live",

        type: "LiveStream",

        target: document.querySelector("#camera"),

        constraints: {

            facingMode: "environment"

        }

    },


    decoder: {

        readers: [

            "ean_reader",

            "ean_8_reader",

            "code_128_reader"

        ]

    }

}, function(err){

    if(err){

        console.log(err);

        return;

    }


    Quagga.start();

});




Quagga.onDetected(function(data){

    let code = data.codeResult.code;


    document.getElementById("result").innerHTML =
    "条码：" + code;


});



</script>


</body>

</html>
