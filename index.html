<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Barcode Entry</title>

<script src="https://unpkg.com/@ericblade/quagga2/dist/quagga.min.js"></script>

<style>

body{
    font-family:Arial;
    text-align:center;
    padding:10px;
}

#camera{
    width:100%;
    max-width:400px;
    margin:auto;
}

input,select,button{
    width:90%;
    max-width:350px;
    padding:12px;
    margin:6px;
    font-size:18px;
}

#barcode{
    background:#eee;
}

</style>

</head>


<body>


<h2>📦 Barcode Scanner</h2>


<div id="camera"></div>


<input id="barcode" placeholder="BARCODE" readonly>


<input id="batch" placeholder="Batch No.">


<input id="pieces" placeholder="Pieces" type="number">


<input id="cartons" placeholder="Cartons" type="number">


<input id="qty" placeholder="Qty(KG)" type="number" step="0.01">



<select id="writer">

<option value="">Written by</option>

<option>Sitong</option>
<option>Yazhen</option>
<option>JIANGHUA</option>
<option>KM</option>
<option>KY</option>
<option>Kyaw</option>

</select>


<button onclick="submitData()">
ENTER / SUBMIT
</button>



<script>


// 开启条码扫描

Quagga.init({

inputStream:{

name:"Live",

type:"LiveStream",

target:document.querySelector("#camera"),

constraints:{

facingMode:"environment"

}

},


decoder:{

readers:[

"ean_reader",

"ean_8_reader",

"code_128_reader"

]

}


},function(err){

if(err){

console.log(err);

return;

}


Quagga.start();


});



Quagga.onDetected(function(data){

let code=data.codeResult.code;


document.getElementById("barcode").value=code;


});




// 发送到 Google Sheet

function submitData(){


let data={


barcode:document.getElementById("barcode").value,

batch:document.getElementById("batch").value,

pieces:document.getElementById("pieces").value,

cartons:document.getElementById("cartons").value,

qty:document.getElementById("qty").value,

writer:document.getElementById("writer").value


};



fetch("https://script.google.com/macros/s/AKfycbzmSzHeBWk12GP0SvdutYbWWxNScXJqlZQvRQu02eVvHVIP7b8b8v8_bSkjnRfVzBfUFQ/exec",{


method:"POST",

body:JSON.stringify(data)


})


.then(response=>response.text())

.then(result=>{


alert("保存成功");


});



}



</script>


</body>

</html>
